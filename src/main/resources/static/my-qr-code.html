<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance QR - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a href="#" id="navbarBrandLink" class="navbar-brand fw-bold">Staff Management Portal</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="welcomeText"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5 text-center">
    <a href="#" id="backToDashboardLink" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Dashboard</a>

    <div class="card shadow-sm p-4 mx-auto" style="max-width: 420px;">
        <h4>My Attendance QR Code</h4>
        <p class="text-muted">Show this to Admin at the entrance to check in or out.</p>
        <div id="qrBox" class="d-flex justify-content-center my-3"></div>
        <div id="timer" class="text-muted small"></div>
        <div id="errorBox" class="alert alert-danger mt-3 d-none"></div>
    </div>
</div>

<script src="js/dashboard.js"></script>
<script src="js/my-qr-code.js"></script>
</body>
</html>
