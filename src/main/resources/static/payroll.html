<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Management - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a href="#" id="navbarBrandLink" class="navbar-brand fw-bold">Staff Management Portal</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="welcomeText"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <a href="#" id="backToDashboardLink" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Dashboard</a>

    <!-- Generate Payslip Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header font-bold">Generate Monthly Payslip</div>
        <div class="card-body">
            <form id="generatePayrollForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label font-medium">Select Staff Member</label>
                    <select class="form-select" id="payrollEmpSelect" required>
                        <option value="">-- Loading Staff Members... --</option>
                    </select>
                </div>

                <!-- Month & Year Dropdown Controls -->
                <div class="col-md-4">
                    <label class="form-label font-medium">Pay Period (Month & Year)</label>
                    <div class="row g-2">
                        <div class="col-7">
                            <select class="form-select" id="payMonthSelect" required>
                                <option value="January">January</option>
                                <option value="February">February</option>
                                <option value="March">March</option>
                                <option value="April">April</option>
                                <option value="May">May</option>
                                <option value="June">June</option>
                                <option value="July">July</option>
                                <option value="August">August</option>
                                <option value="September">September</option>
                                <option value="October">October</option>
                                <option value="November">November</option>
                                <option value="December">December</option>
                            </select>
                        </div>
                        <div class="col-5">
                            <select class="form-select" id="payYearSelect" required>
                                <option value="2024">2024</option>
                                <option value="2025">2025</option>
                                <option value="2026">2026</option>
                                <option value="2027">2027</option>
                                <option value="2028">2028</option>
                                <option value="2029">2029</option>
                                <option value="2030">2030</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Basic Salary (₹)</label>
                    <input type="number" class="form-control" id="basicSalary" required>
                </div>

                <div class="col-12">
                    <label class="form-label">Deductions <small class="text-muted">(optional — add one row per deducted day)</small></label>
                    <div id="deductionLinesContainer"></div>
                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="addDeductionLineBtn">+ Add Deduction</button>
                </div>
                <template id="deductionLineTemplate">
                    <div class="row g-2 mb-2 deduction-line align-items-end">
                        <div class="col-md-4">
                            <input type="date" class="form-control form-control-sm deduction-date" placeholder="Date">
                        </div>
                        <div class="col-md-3">
                            <input type="number" class="form-control form-control-sm deduction-amount" placeholder="Amount (₹)">
                        </div>
                        <div class="col-md-4">
                            <input type="text" class="form-control form-control-sm deduction-reason" placeholder="Reason (e.g. Unapproved Sick Leave)">
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-sm btn-outline-danger remove-deduction-line">&times;</button>
                        </div>
                    </div>
                </template>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary px-4 font-bold">Generate Payslip</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Payroll Records Table -->
    <div class="card shadow-sm">
        <div class="card-header font-bold">All Generated Payslips</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Payslip ID</th>
                    <th>Staff Member</th>
                    <th>Pay Period</th>
                    <th>Basic Salary</th>
                    <th>Deductions</th>
                    <th>Net Salary</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="payrollTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/dashboard.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/payroll.js"></script>
</body>
</html>
