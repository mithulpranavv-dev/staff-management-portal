<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <span class="navbar-brand">Staff Management Portal</span>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="welcomeText"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h4 class="mb-4">Dashboard</h4>
    <div class="row g-4">
        <div class="col-md-4">
            <a href="employees.html" class="text-decoration-none">
                <div class="card shadow-sm p-4 text-center h-100">
                    <h5>Employees</h5>
                    <p class="text-muted mb-0">Manage employee records</p>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="attendance.html" class="text-decoration-none">
                <div class="card shadow-sm p-4 text-center h-100">
                    <h5>Attendance</h5>
                    <p class="text-muted mb-0">Track daily attendance</p>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="leaves.html" class="text-decoration-none">
                <div class="card shadow-sm p-4 text-center h-100">
                    <h5>Leave</h5>
                    <p class="text-muted mb-0">Apply and manage leave</p>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="payroll.html" class="text-decoration-none">
                <div class="card shadow-sm p-4 text-center h-100">
                    <h5>Payroll</h5>
                    <p class="text-muted mb-0">View salary records</p>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a href="tasks.html" class="text-decoration-none">
                <div class="card shadow-sm p-4 text-center h-100">
                    <h5>Tasks</h5>
                    <p class="text-muted mb-0">Track task performance</p>
                </div>
            </a>
        </div>
    </div>
</div>

<script src="js/dashboard.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
