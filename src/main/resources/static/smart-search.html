<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Search - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a href="#" id="navbarBrandLink" class="navbar-brand fw-bold">Staff Management Portal</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="welcomeText"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <a href="#" id="backToDashboardLink" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Dashboard</a>

    <div class="card shadow-sm mb-4">
        <div class="card-header font-bold">Smart Search</div>
        <div class="card-body">
            <form id="searchForm" class="d-flex gap-2">
                <input type="text" class="form-control" id="searchQuery"
                       placeholder='Try: "who is on leave this week" or "pending tasks for Meena"' required>
                <button type="submit" class="btn btn-primary px-4">Search</button>
            </form>
        </div>
    </div>

    <div id="searchStatus" class="text-muted"></div>

    <div id="employeeResults" class="card shadow-sm mb-4 d-none">
        <div class="card-header font-bold">Employees</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>ID</th><th>Name</th><th>Department</th><th>Role</th></tr>
                </thead>
                <tbody id="employeeResultsBody"></tbody>
            </table>
        </div>
    </div>

    <div id="taskResults" class="card shadow-sm mb-4 d-none">
        <div class="card-header font-bold">Tasks</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>Title</th><th>Priority</th><th>Due Date</th><th>Status</th></tr>
                </thead>
                <tbody id="taskResultsBody"></tbody>
            </table>
        </div>
    </div>

    <div id="leaveResults" class="card shadow-sm mb-4 d-none">
        <div class="card-header font-bold">Leave Requests</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr><th>Type</th><th>Dates</th><th>Status</th></tr>
                </thead>
                <tbody id="leaveResultsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/dashboard.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/smart-search.js"></script>
</body>
</html>
