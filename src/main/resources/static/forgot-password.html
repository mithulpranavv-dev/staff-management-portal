<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="card shadow-sm login-card mt-5 mx-auto" style="max-width: 480px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">Reset Password</h3>
                <p class="text-muted small">Verify your identity via email OTP to reset your account password</p>
            </div>

            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
            <div id="successAlert" class="alert alert-success d-none" role="alert"></div>

            <!-- Step Indicators -->
            <div class="d-flex justify-content-between mb-4 position-relative">
                <div class="text-center flex-fill">
                    <span id="stepBadge1" class="badge bg-primary rounded-circle p-2 px-3">1</span>
                    <div class="small fw-bold mt-1">Request OTP</div>
                </div>
                <div class="text-center flex-fill">
                    <span id="stepBadge2" class="badge bg-secondary rounded-circle p-2 px-3">2</span>
                    <div class="small text-muted mt-1">Verify OTP</div>
                </div>
                <div class="text-center flex-fill">
                    <span id="stepBadge3" class="badge bg-secondary rounded-circle p-2 px-3">3</span>
                    <div class="small text-muted mt-1">New Password</div>
                </div>
            </div>

            <!-- STEP 1 FORM: REQUEST OTP -->
            <form id="step1Form">
                <div class="mb-3">
                    <label class="form-label font-medium">Username or Email Address</label>
                    <input type="text" class="form-control" id="emailOrUsername" placeholder="e.g. faculty@college.edu or testadmin" required autofocus>
                    <div class="form-text">We will send a 6-digit verification code (OTP) to your registered email.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 font-bold mb-2">Send Verification OTP</button>
                <a href="index.html" class="btn btn-outline-secondary w-100 font-medium">&larr; Back to Login</a>
            </form>

            <!-- STEP 2 FORM: VERIFY OTP -->
            <form id="step2Form" class="d-none">
                <div class="mb-3 text-center">
                    <label class="form-label font-medium">Enter 6-Digit Verification Code</label>
                    <input type="text" class="form-control text-center font-bold fs-4" id="otpInput" maxlength="6" placeholder="123456" required style="letter-spacing: 0.3em;">
                    <div class="form-text mt-2">An OTP has been dispatched to your email address.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 font-bold mb-2">Verify Code</button>
            </form>

            <!-- STEP 3 FORM: RESET PASSWORD -->
            <form id="step3Form" class="d-none">
                <div class="mb-3">
                    <label class="form-label font-medium">New Password</label>
                    <input type="password" class="form-control" id="resetNewPassword" placeholder="At least 6 characters" required minlength="6">
                </div>
                <div class="mb-3">
                    <label class="form-label font-medium">Confirm New Password</label>
                    <input type="password" class="form-control" id="resetConfirmPassword" placeholder="Repeat new password" required>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 font-bold mb-2">Reset Password & Sign In</button>
            </form>
        </div>
    </div>
</div>

<script src="js/forgot-password.js"></script>
</body>
</html>
