<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="card shadow-sm login-card mt-5 mx-auto" style="max-width: 480px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">Update Password</h3>
                <p class="text-muted small">Set a secure new password for your account</p>
            </div>

            <div id="forcedAlert" class="alert alert-warning d-none" role="alert">
                <strong>Notice:</strong> You are using a temporary or auto-generated password. Please set a new password before continuing.
            </div>

            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
            <div id="successAlert" class="alert alert-success d-none" role="alert"></div>

            <form id="changePasswordForm">
                <div class="mb-3">
                    <label class="form-label font-medium">Current / Temporary Password</label>
                    <input type="password" class="form-control" id="oldPassword" placeholder="••••••••" required>
                </div>

                <div class="mb-3">
                    <label class="form-label font-medium">New Password</label>
                    <input type="password" class="form-control" id="newPassword" placeholder="At least 6 characters" required minlength="6">
                </div>

                <div class="mb-3">
                    <label class="form-label font-medium">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat new password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 font-bold mb-2">Update Password & Continue</button>
                <a href="dashboard.html" id="cancelBtn" class="btn btn-outline-secondary w-100 font-medium">Cancel / Back to Dashboard</a>
            </form>
        </div>
    </div>
</div>

<script src="js/change-password.js"></script>
</body>
</html>
