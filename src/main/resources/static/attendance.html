<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a href="#" id="navbarBrandLink" class="navbar-brand fw-bold">Staff Management Portal</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="welcomeText"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <a href="#" id="backToDashboardLink" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Dashboard</a>

    <!-- Mark Attendance Form with Staff Name Dropdown (Admin only) -->
    <div class="card shadow-sm mb-4" id="markAttendanceCard">
        <div class="card-header font-bold">Mark Attendance</div>
        <div class="card-body">
            <form id="markAttendanceForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label font-medium">Select Staff Member</label>
                    <select class="form-select" id="attEmpSelect" required>
                        <option value="">-- Loading Staff Members... --</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label font-medium">Date</label>
                    <input type="date" class="form-control" id="attDate" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label font-medium">Check In</label>
                    <input type="time" class="form-control" id="checkIn">
                </div>
                <div class="col-md-2">
                    <label class="form-label font-medium">Check Out</label>
                    <input type="time" class="form-control" id="checkOut">
                </div>
                <div class="col-md-2">
                    <label class="form-label font-medium">Status</label>
                    <select class="form-select" id="attStatus">
                        <option value="Present">Present</option>
                        <option value="Late">Late</option>
                        <option value="Absent">Absent</option>
                        <option value="On Leave">On Leave</option>
                    </select>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-success px-4 font-bold">Save Attendance Log</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Attendance History Table -->
    <div class="card shadow-sm">
        <div class="card-header font-bold">All Attendance Records</div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Record ID</th>
                    <th>Employee Name</th>
                    <th>Employee Code</th>
                    <th>Date</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Status</th>
                    <th class="text-end" id="actionColHeader">Action</th>
                </tr>
                </thead>
                <tbody id="attendanceTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/dashboard.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
