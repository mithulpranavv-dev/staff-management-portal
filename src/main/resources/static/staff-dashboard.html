<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a href="#" id="navbarBrandLink" class="navbar-brand">Staff Management Portal</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="welcomeText"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h3 class="mb-4">My Dashboard</h3>
    <div class="row g-4">
        <div class="col-md-3">
            <a href="staff-attendance.html" class="text-decoration-none">
                <div class="card shadow-sm text-center p-4 h-100">
                    <h5>My Attendance</h5>
                    <p class="text-muted small mb-0">View your own attendance record</p>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="staff-leaves.html" class="text-decoration-none">
                <div class="card shadow-sm text-center p-4 h-100">
                    <h5>My Leaves</h5>
                    <p class="text-muted small mb-0">Apply for leave & check status</p>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="staff-payroll.html" class="text-decoration-none">
                <div class="card shadow-sm text-center p-4 h-100">
                    <h5>My Payroll</h5>
                    <p class="text-muted small mb-0">View payslips & deductions</p>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="staff-tasks.html" class="text-decoration-none">
                <div class="card shadow-sm text-center p-4 h-100">
                    <h5>My Tasks</h5>
                    <p class="text-muted small mb-0">View assigned tasks</p>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="my-qr-code.html" class="text-decoration-none">
                <div class="card shadow-sm text-center p-4 h-100">
                    <h5>My QR Code</h5>
                    <p class="text-muted small mb-0">Show this to check in/out</p>
                </div>
            </a>
        </div>
        <div class="col-md-3">
            <a href="smart-search.html" class="text-decoration-none">
                <div class="card shadow-sm text-center p-4 h-100">
                    <h5>Smart Search</h5>
                    <p class="text-muted small mb-0">Search employees, tasks & leaves</p>
                </div>
            </a>
        </div>
    </div>

    <div id="aiInsights" class="mb-5"></div>
</div>

<script src="js/dashboard.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/ai-insights.js"></script>
</body>
</html>
