<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Staff Attendance - Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a href="#" id="navbarBrandLink" class="navbar-brand fw-bold">Staff Management Portal</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="welcomeText"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5 text-center">
    <a href="#" id="backToDashboardLink" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Dashboard</a>

    <div class="card shadow-sm p-4 mx-auto" style="max-width: 480px;">
        <h4>Scan Staff QR to Mark Attendance</h4>
        <p class="text-muted">Point the camera at the staff member's QR code.</p>

        <video id="video" style="width:100%; border-radius:12px;" muted playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>

        <div id="resultBox" class="alert d-none mt-3"></div>
        <button id="scanAgainBtn" class="btn btn-primary mt-2 d-none">Scan Next Staff Member</button>
    </div>
</div>

<script src="js/dashboard.js"></script>
<script src="js/admin-attendance-scan.js"></script>
</body>
</html>
