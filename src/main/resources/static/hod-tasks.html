<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Tasks - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a href="hod-dashboard.html" class="navbar-brand fw-bold">Staff Management Portal</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" id="welcomeText"></span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <a href="hod-dashboard.html" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to Dashboard</a>

    <div class="card shadow-sm mb-4">
        <div class="card-header font-bold">Assign New Task</div>
        <div class="card-body">
            <form id="createTaskForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Assign To Staff Member(s)</label>
                    <select class="form-select" id="taskEmpSelect" multiple size="4" required></select>
                    <small class="text-muted">Hold Ctrl/Cmd to select multiple staff for a combined task</small>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Task Title</label>
                    <input type="text" class="form-control" id="taskTitle" placeholder="e.g. Prepare Question Paper" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Priority</label>
                    <select class="form-select" id="taskPriority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Due Date</label>
                    <input type="date" class="form-control" id="taskDueDate" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Task Description / Instructions</label>
                    <textarea class="form-control" id="taskDescription" rows="2" placeholder="Enter detailed instructions or scope of work..."></textarea>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary px-4">Assign Task</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header font-bold d-flex justify-content-between align-items-center">
            Department Tasks
            <select class="form-select form-select-sm w-auto" id="filterStatus" onchange="renderTasksTable()">
                <option value="ALL">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Task ID</th>
                    <th>Assigned Staff</th>
                    <th>Task Details</th>
                    <th>Priority</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="tasksTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/dashboard.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/hod-tasks.js"></script>
</body>
</html>
