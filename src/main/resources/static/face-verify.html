<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Verification - Staff Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
<div class="container mt-5 text-center">
    <div class="card shadow-sm p-4 mx-auto" style="max-width: 480px;">
        <h4>Face Verification</h4>
        <p class="text-muted">Please look at the camera to complete login.</p>

        <video id="verifyVideo" width="100%" autoplay muted style="border-radius:12px; background:#000;"></video>

        <div id="verifyStatus" class="alert alert-info mt-3">Starting camera...</div>
        <button type="button" class="btn btn-primary d-none" id="verifyBtn">Verify Face</button>
    </div>
</div>

<script src="js/face-enrollment.js"></script>
<script src="js/face-verify.js"></script>
</body>
</html>
